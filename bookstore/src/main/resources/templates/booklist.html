<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<h1>Hello <span sec:authentication="name"></span>!</h1>

<table class="table table-striped">
  <tr>
    <th>Kirjan nimi</th>
    <th>Kirjailija</th>
    <th>Kategoria</th>
    <th>Toiminnallisuudet</th>
  </tr>
  <tr th:each="book : ${books}">
    <td th:text="${book.title}"></td>
    <td th:text="${book.author}"></td>
    <td th:text="${book.category.name}"></td>

    <td>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/delete/{id}(id=${book.id})}">Poista</a>
      <a th:href="@{/edit/{id}(id=${book.id})}">Muokkaa</a>
    </td>
  </tr>
</table>
<a href="/addbook">Lisää kirja</a> <br />
<a href="/index">Etusivu</a> <br />
<br />

<form th:action="@{/logout}" method="post"><input type="submit" value="Kirjaudu ulos" />
</form>
